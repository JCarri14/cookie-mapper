name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: python3 scripts/package_release.py
      - run: python3 scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: cookie-mapper-extension
          path: release/*.zip
